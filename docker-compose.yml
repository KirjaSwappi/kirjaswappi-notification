version: '3.8'

services:
  notification-service:
    build: .
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - LOG_LEVEL=debug
      - ALLOWED_ORIGINS=*
      - SHUTDOWN_TIMEOUT=10
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s